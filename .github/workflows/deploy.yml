name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Get PR number
        run: |
          $prNum = (Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json).pull_request.number
          echo "PR_NUM=$prNum" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh
      - name: Build with PR base path
        run: npx vite build --base=/test-form/pr-${{ env.PR_NUM }}/
      - name: Deploy to gh-pages branch
        run: npx gh-pages --dist dist --dest pr-${{ env.PR_NUM }} --no-history --dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment PR preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            github.rest.issues.createComment({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **PR Preview deployed!**\n\n👉 [Preview für PR #${prNum}](https://felixschoeck.github.io/test-form/pr-${prNum}/)`
            });

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove PR preview directory
        run: |
          $prNum = (Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json).pull_request.number
          if (Test-Path "pr-$prNum") {
            Remove-Item -Recurse -Force "pr-$prNum"
          }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Cleanup preview for PR #$prNum" --allow-empty
          git push
        shell: pwsh
